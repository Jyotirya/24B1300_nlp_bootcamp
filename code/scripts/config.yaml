bm25:
  b: 0.75
  depth: 100
  fields:
  - title
  - abstract
  grid:
    b:
    - 0.3
    - 0.5
    - 0.75
    - 0.9
    k1:
    - 0.6
    - 0.9
    - 1.2
    - 1.5
    - 2.0
    stem:
    - true
    - false
  k1: 1.2
  stem: false
  stopwords: true
dense:
  batch_size: 16
  depth: 100
  device: auto
  max_seq_length: 512
  models:
    general:
      document_prefix: ''
      name: BAAI/bge-base-en-v1.5
      query_prefix: 'Represent this sentence for searching relevant passages: '
    scientific:
      document_prefix: ''
      name: malteos/scincl
      pooling: cls
      query_prefix: ''
  warmup_queries: 1
evaluation:
  ndcg_k: 10
  recall_k: 100
  trec_top_k: 100
finetune:
  base_model: BAAI/bge-base-en-v1.5
  batch_size: 32
  checkpoint_dir: cache/task4
  depth: 100
  device: auto
  epochs: 2
  hard_negative_max_rank: 30
  hard_negative_min_rank: 3
  learning_rate: 1.0e-05
  max_doc_length: 128
  max_query_length: 64
  pooling: cls
  warmup_ratio: 0.1
fusion:
  alpha: 0.5
  candidate_depth: 200
  hybrid_search:
    dense_weights:
    - 1.0
    - 1.5
    - 2.0
    - 3.0
    interpolation_alphas:
    - 0.5
    - 0.6
    - 0.7
    - 0.8
    - 0.9
  include_scientific: true
  method: rrf
  rrf_constant: 60
  rrf_constants:
  - 10
  - 30
  - 60
  weights:
  - 1.0
  - 1.0
hyperparameters: {}
paths:
  cache_dir: cache
  corpus: data/corpus.jsonl
  data_dir: data
  eval_claims: data/eval_claims.jsonl
  logs_dir: logs
  predictions_dir: predictions
  results_dir: results
  results_template: results_template.json
  train_claims: data/train_claims.jsonl
  val_claims: data/val_claims.jsonl
rerank:
  batch_size: 16
  candidate_grid:
  - 10
  - 20
  - 30
  candidate_k: 30
  device: auto
  finetune:
    batch_size: 16
    epochs: 2
    learning_rate: 2.0e-05
    max_length: 512
    warmup_ratio: 0.1
  lambda_grid:
  - 0.5
  - 0.7
  - 1.0
  max_k: 30
  max_length: 384
  model_name: BAAI/bge-reranker-base
roll_no: 24b1300
seed: 42
stages:
  retrieval:
    enabled: true
    model_name: bm25s
    top_k: 100
  verification:
    enabled: false
    model_name: ''
verification:
  batch_size: 16
  candidate_depth: 1
  candidate_depths:
  - 1
  - 2
  - 3
  contradict_threshold: 0.3
  contradict_thresholds:
  - 0.1
  - 0.3
  - 0.5
  device: auto
  ft:
    enabled: true
    nli_gold_rationale_mix: true
    nli_checkpoint: cache/nli_ft/nli.pt
    selector_checkpoint: cache/nli_ft/selector.pt
    selector_model_name: cross-encoder/ms-marco-MiniLM-L-12-v2
  gate: 0.5
  gate_thresholds:
  - 0.0
  - 0.1
  - 0.3
  - 0.5
  model_name: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
  premise_max_length: 256
  premise_sentences: 3
  support_threshold: 0.1
  support_thresholds:
  - 0.05
  - 0.15
  - 0.25
  - 0.4
  - 0.5
